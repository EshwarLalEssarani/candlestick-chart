    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #0d1526;
        --line: #1c2a44;
        --ink: #8b9bb4;
        --strong: #e7eef8;
        --hover: #16233a;
        --active: #1a2740;
        --field: #10192c;
        --accent: #3861fb;
      }
      body.light {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #ffffff;
        --line: #e0e3eb;
        --ink: #4a5160;
        --strong: #131722;
        --hover: #f4f6fa;
        --active: #e8ecf4;
        --field: #f7f8fb;
        --accent: #2962ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      button { font: inherit; color: inherit; }
      .shell { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
      .topbar {
        height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
        border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
      }
      .live-dot { color: #0ecb81; font-size: 11px; font-weight: 650; }
      .live-dot.off { color: var(--ink); font-weight: 500; }
      .search {
        display: flex; align-items: center; gap: 8px; height: 30px; min-width: 132px;
        padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--strong); font-weight: 650;
      }
      .tfs { display: flex; align-items: center; margin-left: 6px; }
      .tfs button, .text-btn, .icon {
        background: transparent; border: 0; height: 30px; border-radius: 5px; cursor: pointer; color: var(--ink);
      }
      .tfs button { padding: 0 8px; }
      .tfs button:hover, .text-btn:hover, .icon:hover, .rail button:hover { background: var(--hover); color: var(--strong); }
      .tfs button[aria-pressed="true"] { background: #1c3358; color: #fff; }
      .text-btn { display: inline-flex; align-items: center; padding: 0 10px; }
      .grow { flex: 1; }
      .icon { width: 30px; display: grid; place-items: center; }
      .icon[aria-pressed="true"] { color: #0ecb81; }
      .workspace { flex: 1; min-height: 0; display: flex; }
      .rail {
        width: 48px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 8px 0; border-right: 1px solid var(--line); background: var(--panel);
      }
      .rail button {
        width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--ink);
        display: grid; place-items: center; cursor: pointer;
      }
      .rail button[aria-pressed="true"] { color: var(--accent); }
      .rail button.dim { opacity: 0.45; }
      .rail .spacer { flex: 1; }
      #chart { flex: 1; min-width: 0; min-height: 0; }
      .flyout {
        position: fixed; z-index: 6; min-width: 196px; padding: 6px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);

      .flyout button {
        display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0;

      }
      .flyout svg { flex: none; }
      .flyout button:hover { background: var(--hover); }
      .popover {
        position: fixed; z-index: 4; min-width: 188px; padding: 6px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      }
      .popover[hidden] { display: none; }
      .popover label {
        display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 5px; cursor: pointer; color: var(--strong);
      }
      .popover label:hover { background: var(--hover); }
      .popover select {
        margin-left: auto; background: var(--field); color: var(--strong); border: 1px solid var(--line);
        border-radius: 4px; padding: 3px 6px; font: inherit;
      }
      .popover .row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; color: var(--strong); }
      #popover { min-width: 248px; max-height: min(70vh, 520px); overflow: auto; }
      .pop-split { height: 1px; margin: 6px 4px; background: var(--line); }
      .custom-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; color: var(--strong); }
      .custom-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .custom-row button {
        margin-left: auto; background: transparent; border: 0; color: var(--ink); cursor: pointer; padding: 4px 6px; border-radius: 4px;
      }
      .custom-row button:hover { background: var(--hover); color: var(--strong); }
      #new-indicator {
        display: block; width: calc(100% - 8px); margin: 4px; height: 28px; border-radius: 5px;
        border: 1px solid var(--line); background: var(--field); color: var(--strong); cursor: pointer;

      #new-indicator:hover { background: var(--hover); }
      .modal-back {

        display: grid; place-items: center; padding: 16px;

      .modal-back[hidden] { display: none; }
      .editor {
        width: min(560px, 100%); background: var(--panel); color: var(--strong);
        border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      }
      .editor h2 { margin: 0 0 4px; font-size: 14px; font-weight: 650; }
      .editor .grid { display: grid; grid-template-columns: 1fr 140px 72px; gap: 8px; }
      .editor label { display: block; margin: 8px 0 4px; color: var(--ink); }
      .editor input[type="text"], .editor select, .editor textarea {
        width: 100%; background: var(--field); color: var(--strong); border: 1px solid var(--line);
        border-radius: 6px; padding: 8px; font: inherit;
      }
      .editor input[type="color"] { width: 100%; height: 32px; padding: 2px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; }
      .editor textarea {
        min-height: 200px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45;
      }
      .editor .hint { margin: 6px 0 0; color: var(--ink); font-size: 11px; }
      .editor .error { min-height: 16px; margin: 8px 0 0; color: #f6465d; }
      .editor .actions { display: flex; gap: 8px; margin-top: 12px; }
      .editor .actions button {

      .editor .actions .danger { margin-right: auto; color: #f6465d; }
      .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      svg { display: block; }
    </style>

    <script>
      const TF = { '1m': 1, '5m': 5, '15m': 15, '1h': 60, '4h': 240, '1D': 1440 };
      const SPECS = {
        ema12: { kind: 'ema', period: 12, color: '#f5c542', lineWidth: 1.6 },
        ema26: { kind: 'ema', period: 26, color: '#5ec8ff', lineWidth: 1.6 },
        sma50: { kind: 'sma', period: 50, color: '#c084fc', lineWidth: 1.6 },
        rsi: { kind: 'rsi', period: 14, color: '#a78bfa', lineWidth: 1.5 },
        bb: { kind: 'bollinger', period: 20, mult: 2, color: '#42a5f5' },
      };

      const chart = CandlestickChart.create(document.getElementById('chart'), {
        header: { symbol: 'BTC/USDT', interval: '1h', exchange: 'Binance' },
        timeScale: { barSpacing: 8, rightOffset: 14 },
        priceScale: { padding: 0.06 },
      });

      const ids = {};
      for (const key of ['ema12', 'ema26', 'sma50', 'rsi']) ids[key] = chart.addOverlay(SPECS[key]);

      let base = [];
      let bars = [];
      let theme = 'dark';
      let currentTf = '1h';
      const SPACING = { '1m': 5, '5m': 6, '15m': 7, '1h': 8, '4h': 12, '1D': 36 };

      function mulberry32(seed) {
        let state = seed >>> 0;
        return function rand() {
          state = (state + 0x6d2b79f5) | 0;
          let t = Math.imul(state ^ (state >>> 15), 1 | state);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function hourTarget(i, n) {
        const tail = Math.min(n, 220);
        const head = n - tail;
        if (i < head) {
          const u = head <= 1 ? 0 : i / (head - 1);
          return 42000 + u * 18000 + Math.sin(u * Math.PI * 6) * 1400 + Math.sin(u * Math.PI * 18) * 420;
        }
        const t = (i - head) / tail;
        if (t < 0.55) {
          const k = t / 0.55;
          const s = k * k * (3 - 2 * k);
          return 59800 + (72340 - 59800) * s + Math.sin(k * Math.PI * 7) * 380;
        }
        if (t < 0.78) {
          const k = (t - 0.55) / 0.23;
          return 72340 + (65980 - 72340) * k + Math.sin(k * Math.PI * 4) * 220;
        }
        if (t < 0.9) {
          const k = (t - 0.78) / 0.12;
          return 65980 + (70120 - 65980) * k + Math.sin(k * Math.PI * 3) * 160;
        }
        const k = (t - 0.9) / 0.1;
        return 70120 + (69012 - 70120) * k + Math.sin(k * Math.PI * 2) * 90;
      }

      function generateHours(count) {
        const rand = mulberry32(7);
        const data = new Array(count);
        const end = Math.floor(Date.now() / 3_600_000) * 3_600_000;
        let time = end - (count - 1) * 3_600_000;
        let price = hourTarget(0, count);
        for (let i = 0; i < count; i++) {
          const target = hourTarget(Math.min(count - 1, i + 1), count);
          const open = price;
          const pull = (target - open) * 0.72;
          const body = (140 + rand() * 720) * (rand() < 0.5 ? -1 : 1);
          let close = open + pull + body * 0.45;
          close += Math.max(-650, Math.min(650, target - close)) * 0.35;
          if (i === count - 1) close = 69012 + (rand() - 0.5) * 30;
          const upper = 90 + rand() * 460;
          const lower = 90 + rand() * 420;
          const spike = rand() > 0.9 ? 800 + rand() * 2800 : 0;
          data[i] = {
            time,
            open,
            close,
            high: Math.max(open, close) + upper,
            low: Math.min(open, close) - lower,
            volume: 280 + rand() * 1100 + Math.abs(close - open) * 0.9 + spike,
          };
          price = close;
          time += 3_600_000;
        }
        data[count - 1].volume = 2340;
        return data;
      }

      function expand(data, barMs) {
        const parts = Math.max(1, Math.round(3_600_000 / barMs));
        const rand = mulberry32(11);
        const out = [];
        for (const bar of data) {
          let price = bar.open;
          for (let part = 0; part < parts; part++) {
            const open = price;
            const close = part === parts - 1
              ? bar.close
              : bar.open + ((bar.close - bar.open) * (part + 1)) / parts + (rand() - 0.5) * (bar.high - bar.low) * 0.12;
            const wick = (bar.high - bar.low) * 0.06 * rand();
            let high = Math.max(open, close) + wick;
            let low = Math.min(open, close) - wick;
            if (high > bar.high) high = Math.max(bar.high, open, close);
            if (low < bar.low) low = Math.min(bar.low, open, close);
            out.push({
              time: bar.time + part * barMs,
              open,
              high,
              low,
              close,
              volume: bar.volume / parts,
            });
            price = close;
          }
        }
        return out;
      }

      function aggregate(data, minutes) {
        const span = minutes * 60000;
        const out = [];
        let bucket = null;
        for (const bar of data) {
          const t = Math.floor(bar.time / span) * span;
          if (!bucket || bucket.time !== t) {
            if (bucket) out.push(bucket);
            bucket = { time: t, open: bar.open, high: bar.high, low: bar.low, close: bar.close, volume: bar.volume };
          } else {
            if (bar.high > bucket.high) bucket.high = bar.high;
            if (bar.low < bucket.low) bucket.low = bar.low;
            bucket.close = bar.close;
            bucket.volume += bar.volume;
          }
        }
        if (bucket) out.push(bucket);
        return out;
      }

      const INTERVAL = { '1m': '1m', '5m': '5m', '15m': '15m', '1h': '1h', '4h': '4h', '1D': '1d' };
      const REST = [
        'https://data-api.binance.vision/api/v3/klines',
        'https://api.binance.com/api/v3/klines',
      ];
      const STREAMS = [
        'wss://data-stream.binance.vision/ws',
        'wss://stream.binance.com:9443/ws',
      ];
      let socket = null;
      let socketGen = 0;
      let loadGen = 0;
      let liveWanted = true;

      function setFeed(text, on) {
        const feed = document.getElementById('feed');
        feed.textContent = text;
        feed.classList.toggle('off', !on);
      }

      async function fetchKlines(interval) {
        let lastError = null;
        for (const base of REST) {
          try {
            const response = await fetch(`${base}?symbol=BTCUSDT&interval=${interval}&limit=1000`);
            if (!response.ok) throw new Error(String(response.status));
            const rows = await response.json();
            if (!Array.isArray(rows) || rows.length === 0) throw new Error('empty');
            return rows.map((row) => ({
              time: row[0],
              open: Number(row[1]),
              high: Number(row[2]),
              low: Number(row[3]),
              close: Number(row[4]),
              volume: Number(row[5]),
            }));
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError;
      }

      function closeSocket() {
        socketGen += 1;
        if (!socket) return;
        socket.onclose = null;
        socket.onmessage = null;
        socket.close();
        socket = null;
      }

      function connectLive(interval) {
        closeSocket();
        const generation = socketGen;
        let host = 0;
        const open = () => {
          if (generation !== socketGen || !liveWanted) return;
          const ws = new WebSocket(`${STREAMS[host]}/btcusdt@kline_${interval}`);
          socket = ws;
          ws.onopen = () => {
            if (generation === socketGen) setFeed('Live', true);
          };
          ws.onmessage = (event) => {
            if (generation !== socketGen) return;
            const candle = JSON.parse(event.data).k;
            if (!candle) return;
            chart.updateBar({
              time: candle.t,
              open: Number(candle.o),
              high: Number(candle.h),
              low: Number(candle.l),
              close: Number(candle.c),
              volume: Number(candle.v),
            });
          };
          ws.onerror = () => ws.close();
          ws.onclose = () => {
            if (socket === ws) socket = null;
            if (generation !== socketGen || !liveWanted) return;
            host = (host + 1) % STREAMS.length;
            setFeed('Reconnecting', false);
            setTimeout(open, 1500);
          };
        };
        open();
      }

      function localBars(label) {
        const minutes = TF[label];
        if (minutes < 60) return expand(base, minutes * 60000);
        if (minutes === 60) return base;
        return aggregate(base, minutes);

      const SCRIPT_KEY = 'candlestick-custom-indicators';
      const SCRIPT_TEMPLATE = `// One number per bar. NaN leaves a gap.
return ema(close, 21);`;
      const SCRIPT_COLORS = ['#f5c542', '#5ec8ff', '#2ebd85', '#f06292', '#ffb74d'];
      let scripts = loadScripts();
      const customIds = {};

      function loadScripts() {
        try {
          const raw = JSON.parse(localStorage.getItem(SCRIPT_KEY) || '[]');
          if (!Array.isArray(raw)) return [];
          return raw.filter((item) => item && typeof item.source === 'string' && typeof item.id === 'string');
        } catch (error) {
          return [];
        }
      }

      function persistScripts() {
        localStorage.setItem(SCRIPT_KEY, JSON.stringify(scripts));
      }

      function finiteWindow(source, index, period) {
        for (let i = index - period + 1; i <= index; i++) {
          if (!Number.isFinite(source[i])) return false;
        }
        return true;
      }

      function sma(source, period) {
        const p = Math.max(1, period | 0);
        const out = new Float64Array(source.length);
        let sum = 0;
        for (let i = 0; i < source.length; i++) {
          const value = source[i];
          sum += Number.isFinite(value) ? value : 0;
          if (i >= p) {
            const old = source[i - p];
            sum -= Number.isFinite(old) ? old : 0;
          }
          out[i] = i >= p - 1 && finiteWindow(source, i, p) ? sum / p : NaN;
        }
        return out;
      }

      function ema(source, period) {
        const p = Math.max(1, period | 0);
        const out = new Float64Array(source.length);
        const k = 2 / (p + 1);
        let seed = 0;
        let count = 0;
        let ready = false;
        for (let i = 0; i < source.length; i++) {
          const value = source[i];
          if (!Number.isFinite(value)) {
            out[i] = NaN;
            seed = 0;
            count = 0;
            ready = false;
            continue;
          }
          if (!ready) {
            seed += value;
            count += 1;
            if (count < p) out[i] = NaN;
            else {
              ready = true;
              out[i] = seed / p;
            }
          } else out[i] = value * k + out[i - 1] * (1 - k);
        }
        return out;
      }

      function rsi(source, period) {
        const p = Math.max(1, period | 0);
        const out = new Float64Array(source.length);
        if (source.length) out[0] = NaN;
        let gain = 0;
        let loss = 0;
        let warm = 0;
        let ready = false;
        for (let i = 1; i < source.length; i++) {
          const prev = source[i - 1];
          const value = source[i];
          if (!Number.isFinite(prev) || !Number.isFinite(value)) {
            out[i] = NaN;
            gain = 0;
            loss = 0;
            warm = 0;
            ready = false;
            continue;
          }
          const delta = value - prev;
          const up = delta > 0 ? delta : 0;
          const down = delta < 0 ? -delta : 0;
          if (!ready) {
            gain += up;
            loss += down;
            warm += 1;
            if (warm < p) out[i] = NaN;
            else {
              ready = true;
              gain /= p;
              loss /= p;
              out[i] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
            }
          } else {
            gain = (gain * (p - 1) + up) / p;
            loss = (loss * (p - 1) + down) / p;
            out[i] = loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
          }
        }
        return out;
      }

      function stdev(source, period) {
        const p = Math.max(1, period | 0);
        const out = new Float64Array(source.length);
        for (let i = 0; i < source.length; i++) {
          if (i < p - 1 || !finiteWindow(source, i, p)) {
            out[i] = NaN;
            continue;
          }
          let sum = 0;
          let sumSq = 0;
          for (let k = i - p + 1; k <= i; k++) {
            const value = source[k];
            sum += value;
            sumSq += value * value;
          }
          let variance = (sumSq - (sum * sum) / p) / p;
          if (variance < 0) variance = 0;
          out[i] = Math.sqrt(variance);
        }
        return out;
      }

      function extreme(source, period, pick) {
        const p = Math.max(1, period | 0);
        const out = new Float64Array(source.length);
        for (let i = 0; i < source.length; i++) {
          if (i < p - 1 || !finiteWindow(source, i, p)) {
            out[i] = NaN;
            continue;
          }
          let value = source[i - p + 1];
          for (let k = i - p + 2; k <= i; k++) value = pick(value, source[k]);
          out[i] = value;
        }
        return out;
      }

      function highest(source, period) { return extreme(source, period, Math.max); }
      function lowest(source, period) { return extreme(source, period, Math.min); }

      function change(source, period) {
        const p = Math.max(1, period | 0);
        const out = new Float64Array(source.length);
        for (let i = 0; i < source.length; i++) {
          const now = source[i];
          const then = i >= p ? source[i - p] : NaN;
          out[i] = Number.isFinite(now) && Number.isFinite(then) ? now - then : NaN;
        }
        return out;
      }

      function offset(source, period) {
        const p = Math.max(0, period | 0);
        const out = new Float64Array(source.length);
        for (let i = 0; i < source.length; i++) {
          const value = i >= p ? source[i - p] : NaN;
          out[i] = Number.isFinite(value) ? value : NaN;
        }
        return out;
      }

      function combine(a, b, op) {
        const aList = typeof a === 'number' ? null : a;
        const bList = typeof b === 'number' ? null : b;
        const n = (aList || bList).length;
        const out = new Float64Array(n);
        for (let i = 0; i < n; i++) {
          const av = aList ? aList[i] : a;
          const bv = bList ? bList[i] : b;
          const value = Number.isFinite(av) && Number.isFinite(bv) ? op(av, bv) : NaN;
          out[i] = value;
        }
        return out;
      }

      function add(a, b) { return combine(a, b, (x, y) => x + y); }
      function sub(a, b) { return combine(a, b, (x, y) => x - y); }
      function mul(a, b) { return combine(a, b, (x, y) => x * y); }
      function div(a, b) { return combine(a, b, (x, y) => y === 0 ? NaN : x / y); }

      function pair(left, right, weigh) {
        const out = new Float64Array(left.length);
        for (let i = 0; i < left.length; i++) {
          const a = left[i];
          const b = right[i];
          out[i] = Number.isFinite(a) && Number.isFinite(b) ? weigh(a, b) : NaN;
        }
        return out;
      }

      function compileIndicator(source) {
        let fn;
        try {
          fn = new Function(
            'open', 'high', 'low', 'close', 'volume', 'hl2', 'hlc3', 'ohlc4',
            'sma', 'ema', 'rsi', 'stdev', 'highest', 'lowest', 'change', 'add', 'sub', 'mul', 'div', 'offset',
            `"use strict";\n${source}`,
          );
        } catch (error) {
          throw new Error(error.message || 'Could not read the script');
        }
        return function compute(bars) {
          const high = bars.high;
          const low = bars.low;
          const close = bars.close;
          const hl2 = pair(high, low, (a, b) => (a + b) / 2);
          const hlc3 = pair(hl2, close, (a, b) => (a * 2 + b) / 3);
          const open = bars.open;
          const ohlc4 = new Float64Array(bars.length);
          for (let i = 0; i < bars.length; i++) {
            const values = [open[i], high[i], low[i], close[i]];
            ohlc4[i] = values.every(Number.isFinite) ? (values[0] + values[1] + values[2] + values[3]) / 4 : NaN;
          }
          const out = fn(
            open, high, low, close, bars.volume, hl2, hlc3, ohlc4,
            sma, ema, rsi, stdev, highest, lowest, change, add, sub, mul, div, offset,
          );
          if (typeof out === 'number') return out;
          if (!out || typeof out.length !== 'number') throw new Error('Return an array with one value per bar.');
          return out;
        };
      }

      function trialScript(compute) {
        const close = new Float64Array(40);
        for (let i = 0; i < close.length; i++) close[i] = 100 + Math.sin(i / 3) * 5 + i * 0.2;
        compute({ open: close, high: close, low: close, close, volume: close, length: close.length });
      }

      function mountScript(item) {
        if (customIds[item.id]) {
          chart.removeOverlay(customIds[item.id]);
          delete customIds[item.id];
        }
        if (!item.enabled) return '';
        let compute;
        try {
          compute = compileIndicator(item.source);
          trialScript(compute);
        } catch (error) {
          item.enabled = false;
          return error.message || 'Script failed';
        }
        customIds[item.id] = chart.addOverlay({
          kind: 'script',
          period: 1,
          label: item.name || 'Script',
          pane: item.pane === 'oscillator' ? 'oscillator' : 'price',
          color: item.color || '#f5c542',
          lineWidth: 1.6,
          compute,
        });
        return '';
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      }

      function renderScripts() {
        const list = document.getElementById('custom-list');
        list.innerHTML = scripts.map((item) => `
          <div class="custom-row">
            <input type="checkbox" data-custom="${escapeHtml(item.id)}" ${item.enabled ? 'checked' : ''} />
            <i class="swatch" style="background:${escapeHtml(item.color || '#f5c542')}"></i>
            <span>${escapeHtml(item.name || 'Script')}</span>
            <button type="button" data-edit="${escapeHtml(item.id)}">Edit</button>
          </div>
        `).join('');
      }

      function closeEditor() {
        document.getElementById('editor-back').hidden = true;

      function openEditor(id) {
        const item = scripts.find((entry) => entry.id === id);
        document.getElementById('editor-title').textContent = item ? 'Edit indicator' : 'New indicator';
        document.getElementById('ind-name').value = item ? item.name : '';

        document.getElementById('ind-color').value = item && /^#[0-9a-fA-F]{6}$/.test(item.color) ? item.color : SCRIPT_COLORS[scripts.length % SCRIPT_COLORS.length];

        document.getElementById('ind-error').textContent = '';

        document.getElementById('editor').dataset.id = item ? item.id : '';
        document.getElementById('editor-back').hidden = false;
        document.getElementById('ind-source').focus();
      }

      document.getElementById('custom-list').addEventListener('change', (event) => {
        const input = event.target.closest('[data-custom]');
        if (!input) return;
        const item = scripts.find((entry) => entry.id === input.dataset.custom);
        if (!item) return;
        item.enabled = input.checked;
        const message = mountScript(item);
        if (message) {
          input.checked = false;
          openEditor(item.id);
          document.getElementById('ind-error').textContent = message;
        }
        persistScripts();
        renderScripts();
      });
      document.getElementById('ind-cancel').addEventListener('click', closeEditor);
      document.getElementById('editor-back').addEventListener('click', (event) => {
        if (event.target.id === 'editor-back') closeEditor();
      });
      document.getElementById('ind-delete').addEventListener('click', () => {
        const id = document.getElementById('editor').dataset.id;
        const item = scripts.find((entry) => entry.id === id);
        if (item) {
          item.enabled = false;
          mountScript(item);
        }
        scripts = scripts.filter((entry) => entry.id !== id);
        persistScripts();
        renderScripts();
        closeEditor();
      });
      document.getElementById('editor').addEventListener('submit', (event) => {
        event.preventDefault();
        const source = document.getElementById('ind-source').value;
        const error = document.getElementById('ind-error');
        let compute;
        try {
          compute = compileIndicator(source);
          trialScript(compute);
        } catch (failure) {
          error.textContent = failure.message || 'Script failed';
          return;
        }
        const id = document.getElementById('editor').dataset.id || `c${Date.now().toString(36)}${Math.floor(Math.random() * 1000).toString(36)}`;
        const next = {
          id,
          name: document.getElementById('ind-name').value.trim() || 'Script',
          pane: document.getElementById('ind-pane').value,
          color: document.getElementById('ind-color').value,
          source,
          enabled: true,
        };
        const index = scripts.findIndex((entry) => entry.id === id);
        if (index >= 0) scripts[index] = next;
        else scripts.push(next);
        mountScript(next);
        persistScripts();
        renderScripts();
        closeEditor();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !document.getElementById('editor-back').hidden) closeEditor();
      });
      for (const item of scripts) mountScript(item);
      persistScripts();
      renderScripts();

      chart.subscribeSeriesChange((bar) => {
        if (!bar || !bars.length) return;
        if (bar.time !== bars[bars.length - 1].time) bars.push(bar);
        else bars[bars.length - 1] = bar;
      });

      function setLive(on) {
        liveWanted = on;
        document.getElementById('opt-live').checked = on;
        if (!on) {
          closeSocket();
          setFeed('Paused', false);
          return;
        }
        chart.scrollToRealtime();
        connectLive(INTERVAL[currentTf]);
      }

      function setMagnet(on) {
        chart.setMagnet(on);
        document.getElementById('magnet').setAttribute('aria-pressed', on ? 'true' : 'false');
        document.getElementById('opt-magnet').checked = on;
      }
      function setLock(on) {
        chart.setDrawingsLocked(on);
        document.getElementById('lock').setAttribute('aria-pressed', on ? 'true' : 'false');
        document.getElementById('opt-lock').checked = on;
      }

      document.getElementById('magnet').addEventListener('click', (event) => {
        setMagnet(event.currentTarget.getAttribute('aria-pressed') !== 'true');
      });
      document.getElementById('lock').addEventListener('click', (event) => {
        setLock(event.currentTarget.getAttribute('aria-pressed') !== 'true');
      });
      document.getElementById('eye').addEventListener('click', (event) => {
        const hidden = event.currentTarget.getAttribute('aria-pressed') !== 'true';
        event.currentTarget.setAttribute('aria-pressed', hidden ? 'true' : 'false');
        event.currentTarget.classList.toggle('dim', hidden);
        chart.setDrawingsVisible(!hidden);
      });
      document.getElementById('style').addEventListener('change', (event) => {
        chart.setSeriesStyle(event.target.value);
      });
      document.getElementById('opt-grid').addEventListener('change', (event) => {
        chart.applyOptions({ grid: { visible: event.target.checked } });
      });
      document.getElementById('opt-volume').addEventListener('change', (event) => {
        chart.applyOptions({ volume: { visible: event.target.checked } });
      });
      document.getElementById('opt-magnet').addEventListener('change', (event) => setMagnet(event.target.checked));
      document.getElementById('opt-lock').addEventListener('change', (event) => setLock(event.target.checked));
      document.getElementById('opt-live').addEventListener('change', (event) => setLive(event.target.checked));

      base = generateHours(18 * 24);
      show('1h');
    </script>
  </body>
</html>
